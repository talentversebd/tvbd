<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form — TalentVerse Bangladesh</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{background:var(--bg);min-height:100vh}
.pf-wrap{max-width:640px;margin:0 auto;padding:32px 18px 60px;}
.pf-head{background:var(--card);border:1px solid var(--bdr2);border-top:6px solid var(--blue-br);border-radius:14px;padding:26px 24px;margin-bottom:18px;text-align:center}
.pf-head img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;margin-bottom:10px}
.pf-head h1{font-family:Montserrat;font-weight:800;font-size:1.4rem;margin-bottom:6px}
.pf-head p{color:var(--muted);font-size:.9rem;white-space:pre-line}
.pf-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:20px;margin-bottom:14px}
.pf-q-label{font-size:.95rem;font-weight:700;margin-bottom:4px;}
.pf-req{color:#f87171;margin-left:3px;}
.pf-input{width:100%;background:var(--card2);border:1px solid var(--bdr);color:var(--txt);padding:11px 13px;border-radius:8px;font-size:.9rem;outline:none;margin-top:10px;transition:border-color .2s,box-shadow .2s}
.pf-input:focus{border-color:var(--blue-br);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.pf-file-btn{display:inline-block;margin-top:10px;padding:10px 18px;background:var(--card2);border:1px dashed var(--bdr);color:var(--blue-br);border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;transition:border-color .2s,background .2s}
.pf-file-btn:hover{border-color:var(--blue-br);background:rgba(59,130,246,.08)}
.pf-file-status{margin-top:10px;font-size:.85rem;}
textarea.pf-input{min-height:90px;resize:vertical}
.pf-opt{display:flex;align-items:center;gap:10px;padding:9px 4px;cursor:pointer}
.pf-opt input{width:17px;height:17px;accent-color:var(--blue-br);cursor:pointer;flex-shrink:0}
.pf-opt span{font-size:.88rem}
.pf-err{color:#f87171;font-size:.76rem;margin-top:6px;display:none}
.pf-err.show{display:block}
.pf-submit{width:100%;background:linear-gradient(135deg,var(--blue),var(--blue-dk));color:#fff;border:none;padding:14px;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;box-shadow:var(--glow);transition:opacity .2s}
.pf-submit:hover{opacity:.88}
.pf-submit:disabled{opacity:.6;cursor:not-allowed}
.pf-state{text-align:center;padding:70px 20px;color:var(--muted)}
.pf-state .ei{font-size:2.8rem;margin-bottom:14px}
.pf-state h2{font-family:Montserrat;font-weight:800;color:var(--txt);margin-bottom:8px;font-size:1.25rem}
.pf-hidden{display:none}
.pf-head p{white-space:pre-line;}
.pf-link{color:#22c55e;font-weight:600;text-decoration:underline;word-break:break-all;}
.pf-link:hover{color:#16a34a;}
.pf-section{padding:18px 4px 10px;margin-top:8px;border-top:1px solid var(--bdr);}
.pf-section:first-child{border-top:none;margin-top:0;padding-top:0;}
.pf-section h3{font-family:Montserrat;font-weight:800;font-size:1.05rem;color:var(--blue-br);margin-bottom:4px;}
.pf-section p{color:var(--muted);font-size:.85rem;white-space:pre-line;}
.pf-rev-item{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:14px;margin-bottom:10px}
.pf-rev-q{font-size:.85rem;font-weight:700;margin-bottom:6px;color:var(--txt)}
.pf-rev-badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;margin-left:6px}
.pf-rev-badge.ok{background:rgba(34,197,94,.14);color:#4ade80}
.pf-rev-badge.no{background:rgba(239,68,68,.14);color:#f87171}
.pf-rev-line{font-size:.8rem;color:var(--muted);margin-top:2px}
.pf-rev-correct{color:#4ade80}
.pf-timer{position:sticky;top:0;z-index:20;background:var(--card);border:1px solid var(--bdr2);border-radius:10px;padding:10px 16px;margin-bottom:14px;text-align:center;font-weight:700;font-size:.95rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pf-timer.pf-warn{color:#f87171;border-color:rgba(239,68,68,.35)}
</style>
</head>
<body>

<div class="pf-wrap">
  <div id="pf-loading" class="pf-state"><div class="ei">⏳</div><p>Loading form…</p></div>

  <div id="pf-notfound" class="pf-state pf-hidden">
    <div class="ei">⚠️</div>
    <h2>Form Not Available</h2>
    <p>This form doesn't exist or isn't accepting responses right now.</p>
  </div>

  <div id="pf-closed" class="pf-state pf-hidden">
    <img id="pf-closed-logo" src="logo.jpg" alt="Logo" style="width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;margin-bottom:14px;">
    <h2 id="pf-closed-title"></h2>
    <p id="pf-closed-msg"></p>
  </div>

  <div id="pf-thanks" class="pf-state pf-hidden">
    <div class="ei">🎉</div>
    <h2 id="pf-thanks-title">Response Submitted!</h2>
    <p id="pf-thanks-sub">Thank you — your response has been recorded.</p>
    <div id="pf-score-box" class="pf-hidden" style="margin:18px 0;">
      <div style="font-family:Montserrat;font-weight:800;font-size:2rem;color:var(--blue-br);" id="pf-score-num"></div>
      <div style="font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;">Your Score</div>
    </div>
    <div id="pf-review" style="text-align:left;margin-top:10px;"></div>
  </div>

  <div id="pf-form-view" class="pf-hidden">
    <div id="pf-timer" class="pf-timer pf-hidden">⏱ Time Left: <span id="pf-timer-text">--:--</span></div>
    <div class="pf-head">
      <img src="logo.jpg" alt="Logo">
      <h1 id="pf-title"></h1>
      <p id="pf-desc"></p>
    </div>
    <div id="pf-fields"></div>
    <button class="pf-submit" id="pf-submit-btn" onclick="submitCustomForm()">Submit</button>
  </div>
</div>

<div id="toast" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--bdr2);color:var(--txt);padding:12px 20px;border-radius:10px;font-size:.85rem;display:flex;align-items:center;gap:9px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999">
  <span id="t-ico">✅</span><span id="t-msg"></span>
</div>

<script src="firebase-config.js" type="module"></script>
<script src="data.js"></script>
<script>
function toast(msg, isErr = false) {
  const t = document.getElementById('toast');
  const ico = document.getElementById('t-ico');
  const tmsg = document.getElementById('t-msg');
  if(!t) return;
  if(ico) ico.textContent = isErr ? '❌' : '✅';
  if(tmsg) tmsg.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

let pfForm = null;
let pfTimerInterval = null;
let pfSecondsLeft = 0;
let pfAutoSubmitting = false;

function showPfState(id) {
  ['pf-loading', 'pf-notfound', 'pf-closed', 'pf-thanks', 'pf-form-view'].forEach(s => {
    document.getElementById(s).classList.toggle('pf-hidden', s !== id);
  });
}

function fmtPfDate(ts) {
  if(!ts) return '';
  return new Date(ts).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

// Escapes HTML, then turns any http(s)/www URL in the text into a clickable,
// green link (like Google Forms does in question/description text), and
// preserves line breaks.
function linkify(text) {
  if(!text) return '';
  const esc = String(text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc.replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi, (m) => {
    const href = m.startsWith('http') ? m : `https://${m}`;
    return `<a href="${href}" target="_blank" rel="noopener" class="pf-link">${m}</a>`;
  });
}

async function initPublicForm() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(!id) return showPfState('pf-notfound');

  const form = await getCustomFormById(id);
  if(!form) return showPfState('pf-notfound');

  const avail = getFormAvailability(form);
  if(avail.state !== 'open') {
    const defaultMsg = avail.state === 'scheduled'
      ? `This form will open on ${fmtPfDate(avail.startAt)}.`
      : avail.state === 'closed'
        ? `This form closed on ${fmtPfDate(avail.endAt)}.`
        : `This form is not accepting responses right now.`;
    document.getElementById('pf-closed-title').textContent = form.title;
    document.getElementById('pf-closed-msg').textContent = form.closedMessage ? form.closedMessage : defaultMsg;
    return showPfState('pf-closed');
  }

  pfForm = form;
  document.getElementById('pf-title').textContent = form.title;
  document.getElementById('pf-desc').innerHTML = linkify(form.description || '');
  renderPfFields();
  showPfState('pf-form-view');

  if(form.isQuiz && form.duration) {
    pfSecondsLeft = form.duration * 60;
    document.getElementById('pf-timer').classList.remove('pf-hidden');
    updatePfTimerText();
    pfTimerInterval = setInterval(() => {
      pfSecondsLeft--;
      updatePfTimerText();
      if(pfSecondsLeft <= 0) {
        clearInterval(pfTimerInterval);
        toast("Time's up — submitting your answers…", true);
        pfAutoSubmitting = true;
        submitCustomForm();
      }
    }, 1000);
  }
}

function updatePfTimerText() {
  const m = Math.floor(pfSecondsLeft / 60);
  const s = pfSecondsLeft % 60;
  const el = document.getElementById('pf-timer');
  document.getElementById('pf-timer-text').textContent = `${m}:${String(s).padStart(2, '0')}`;
  el.classList.toggle('pf-warn', pfSecondsLeft <= 60);
}

function renderPfFields() {
  const wrap = document.getElementById('pf-fields');
  let qNum = 0;
  wrap.innerHTML = (pfForm.fields || []).map((f) => {
    if(f.type === 'section') {
      return `
        <div class="pf-section">
          <h3>${linkify(f.label)}</h3>
          ${f.description ? `<p>${linkify(f.description)}</p>` : ''}
        </div>`;
    }
    qNum++;
    const req = f.required ? '<span class="pf-req">*</span>' : '';
    let control = '';
    if(f.type === 'short') {
      control = `<input class="pf-input" type="text" id="pf-in-${f.id}" placeholder="Your answer">`;
    } else if(f.type === 'paragraph') {
      control = `<textarea class="pf-input" id="pf-in-${f.id}" placeholder="Your answer"></textarea>`;
    } else if(f.type === 'mcq') {
      control = (f.options || []).map((opt, oi) => `
        <label class="pf-opt">
          <input type="radio" name="pf-in-${f.id}" value="${(opt || '').replace(/"/g, '&quot;')}">
          <span>${opt}</span>
        </label>`).join('');
    } else if(f.type === 'checkbox') {
      control = (f.options || []).map((opt, oi) => `
        <label class="pf-opt">
          <input type="checkbox" data-group="pf-in-${f.id}" value="${(opt || '').replace(/"/g, '&quot;')}">
          <span>${opt}</span>
        </label>`).join('');
    } else if(f.type === 'dropdown') {
      control = `<select class="pf-input" id="pf-in-${f.id}">
        <option value="">Select…</option>
        ${(f.options || []).map(opt => `<option value="${(opt || '').replace(/"/g, '&quot;')}">${opt}</option>`).join('')}
      </select>`;
    } else if(f.type === 'file') {
      control = `
        <input type="file" accept="image/*" id="pf-file-${f.id}" data-fid="${f.id}" style="display:none;" onchange="handlePfFileUpload(this)">
        <input type="hidden" id="pf-in-${f.id}" value="">
        <label class="pf-file-btn" id="pf-file-btn-${f.id}" for="pf-file-${f.id}">📎 Choose an image to upload</label>
        <div class="pf-file-status" id="pf-file-status-${f.id}"></div>
        <p style="font-size:.75rem;color:var(--muted);margin-top:6px;">Only image files (photo, screenshot). Max ~32MB.</p>`;
    }
    return `
      <div class="pf-card" data-field="${f.id}">
        <div class="pf-q-label">${qNum}. ${linkify(f.label)}${req}</div>
        ${control}
        <div class="pf-err" id="pf-err-${f.id}">This question is required.</div>
      </div>`;
  }).join('');
}

function getPfFieldValue(f) {
  if(f.type === 'short' || f.type === 'paragraph' || f.type === 'dropdown' || f.type === 'file') {
    return document.getElementById(`pf-in-${f.id}`).value.trim();
  }
  if(f.type === 'mcq') {
    const sel = document.querySelector(`input[name="pf-in-${f.id}"]:checked`);
    return sel ? sel.value : '';
  }
  if(f.type === 'checkbox') {
    const sels = document.querySelectorAll(`input[data-group="pf-in-${f.id}"]:checked`);
    return Array.from(sels).map(s => s.value);
  }
  return '';
}

async function handlePfFileUpload(input) {
  const fid = input.dataset.fid;
  const file = input.files[0];
  const statusEl = document.getElementById(`pf-file-status-${fid}`);
  const btnEl = document.getElementById(`pf-file-btn-${fid}`);
  const hiddenEl = document.getElementById(`pf-in-${fid}`);
  if(!file) return;

  if(!file.type.startsWith('image/')) {
    statusEl.innerHTML = `<span style="color:#f87171;">❌ Only image files are supported.</span>`;
    input.value = '';
    return;
  }

  hiddenEl.value = '';
  statusEl.innerHTML = `⏳ Uploading…`;
  btnEl.style.pointerEvents = 'none';

  const result = await uploadToImgBB(file);

  btnEl.style.pointerEvents = '';
  if(result.success) {
    hiddenEl.value = result.url;
    statusEl.innerHTML = `<img src="${result.url}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px;border:1px solid var(--bdr);"><span style="color:#34d399;">✅ Uploaded</span>`;
    btnEl.textContent = '📎 Change image';
    const errEl = document.getElementById(`pf-err-${fid}`);
    if(errEl) errEl.classList.remove('show');
  } else {
    statusEl.innerHTML = `<span style="color:#f87171;">❌ Upload failed — try again.</span>`;
    input.value = '';
  }
}

function arraysEqualUnordered(a, b) {
  if(!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
  const sa = [...a].sort(), sb = [...b].sort();
  return sa.every((v, i) => v === sb[i]);
}

function gradePfSubmission(answers) {
  let score = 0, totalPossible = 0;
  const review = [];
  (pfForm.fields || []).forEach(f => {
    const gradable = ['mcq', 'dropdown', 'checkbox'].includes(f.type);
    if(!gradable) return;
    const pts = f.points ?? 1;
    totalPossible += pts;
    const given = answers[f.id];
    let correct;
    if(f.type === 'checkbox') correct = arraysEqualUnordered(given || [], f.correctAnswers || []);
    else correct = given === f.correctAnswer;
    if(correct) score += pts;
    review.push({
      label: f.label, correct,
      given: Array.isArray(given) ? (given.join(', ') || '(no answer)') : (given || '(no answer)'),
      correctAnswer: Array.isArray(f.correctAnswers) ? f.correctAnswers.join(', ') : f.correctAnswer
    });
  });
  return { score, totalPossible, review };
}

async function submitCustomForm() {
  const btnCheck = document.getElementById('pf-submit-btn');
  if(btnCheck.disabled) return; // already submitting (e.g. timer fired at the same moment)

  const answers = {};
  let hasError = false;

  (pfForm.fields || []).forEach(f => {
    if(f.type === 'section') return;
    const val = getPfFieldValue(f);
    const isEmpty = Array.isArray(val) ? val.length === 0 : !val;
    const errEl = document.getElementById(`pf-err-${f.id}`);
    if(f.required && isEmpty && !pfAutoSubmitting) {
      errEl.classList.add('show');
      hasError = true;
    } else {
      errEl.classList.remove('show');
    }
    answers[f.id] = val;
  });

  if(hasError) return toast("Please answer all required questions.", true);

  if(pfTimerInterval) clearInterval(pfTimerInterval);
  const btn = document.getElementById('pf-submit-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  const resp = { formId: pfForm.id, answers };
  let grading = null;
  if(pfForm.isQuiz) {
    grading = gradePfSubmission(answers);
    resp.score = grading.score;
    resp.totalPossible = grading.totalPossible;
  }

  const result = await addFormResponse(resp);

  btn.disabled = false;
  btn.textContent = 'Submit';

  if(result.success) {
    document.getElementById('pf-thanks-title').textContent = pfForm.thankYouTitle || 'Response Submitted!';
    document.getElementById('pf-thanks-sub').textContent = pfForm.thankYouMessage || 'Thank you — your response has been recorded.';
    if(pfForm.isQuiz && grading) {
      if(!pfForm.thankYouMessage) document.getElementById('pf-thanks-sub').textContent = 'Here\'s how you did:';
      document.getElementById('pf-score-box').classList.remove('pf-hidden');
      document.getElementById('pf-score-num').textContent = `${grading.score} / ${grading.totalPossible}`;
      document.getElementById('pf-review').innerHTML = grading.review.map(r => `
        <div class="pf-rev-item">
          <div class="pf-rev-q">${r.label}<span class="pf-rev-badge ${r.correct ? 'ok' : 'no'}">${r.correct ? 'Correct' : 'Incorrect'}</span></div>
          <div class="pf-rev-line">Your answer: ${r.given}</div>
          ${!r.correct ? `<div class="pf-rev-line pf-rev-correct">Correct answer: ${r.correctAnswer}</div>` : ''}
        </div>`).join('');
    }
    showPfState('pf-thanks');
  } else {
    toast("Something went wrong. Please try again.", true);
  }
}

initPublicForm();
</script>
</body>
</html>
