<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Network Test</title>
<style>
body{margin:0;background:#060b19;color:#eef2ff;font-family:system-ui,sans-serif;padding:16px}
h1{font-size:1.2rem;margin:4px 0 12px}button{background:#1f6bf2;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:1rem;font-weight:700;margin:6px 6px 6px 0;min-height:46px}
button.s{background:#1b2540}pre{white-space:pre-wrap;word-break:break-word;background:#0d1526;border:1px solid #28406e;border-radius:12px;padding:12px;font-size:.85rem;line-height:1.55}
.ok{color:#4ade80}.er{color:#fca5a5}small{color:#8da2c8}
</style></head><body>
<h1>🔧 Network connection test</h1>
<small>This page checks each step and shows the exact error code.</small><br>
<button id="run">▶ Run test</button><button class="s" id="save">💾 Test saving (all 3 games)</button><button class="s" id="copy">📋 Copy result</button>
<pre id="out">Press “Run test”.</pre>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, getDoc, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
const cfg={apiKey:"AIzaSyCa0pO6ZYJfCeIzqdfMpJmBAA3-qpnM5cw",authDomain:"tv-network-hub.firebaseapp.com",projectId:"tv-network-hub",storageBucket:"tv-network-hub.firebasestorage.app",messagingSenderId:"1072480251627",appId:"1:1072480251627:web:dc6cadaeff460cf72ad8ae"};
const out=document.getElementById('out');let log=[];
const say=(t,c)=>{log.push(t);out.innerHTML=log.map(x=>x.startsWith('✅')?`<span class="ok">${x}</span>`:x.startsWith('❌')?`<span class="er">${x}</span>`:x).join('\n')};
const app=initializeApp(cfg,'diag'),db=getFirestore(app),auth=getAuth(app);let user=null;
async function run(){log=[];say('Page: '+location.href);say('Project: '+cfg.projectId);
 try{const c=await signInAnonymously(auth);user=c.user;say('✅ 1. Anonymous sign-in OK (uid '+user.uid.slice(0,8)+'…)')}catch(e){say('❌ 1. Anonymous sign-in FAILED: '+(e.code||e.message));say('   → Firebase → Authentication → Sign-in method → enable “Anonymous”. If code is auth/configuration-not-found, click “Get started” in Authentication first.');return}
 let ids=[];try{const s=await getDocs(collection(db,'sites'));ids=s.docs.map(d=>d.id);say('✅ 2. Reading site list OK: ['+ids.join(', ')+']')}catch(e){say('❌ 2. Reading site list FAILED: '+(e.code||e.message));say('   → Firestore Database not created, or Rules not published (Rules must contain “match /sites/{siteId}”).');return}
 if(!ids.length)say('❌ 3. The site list is EMPTY → open network-admin.html and add your sites.');
 else{say(ids.includes('tvbd')?'✅ 3a. site “tvbd” exists':'❌ 3a. site “tvbd” is MISSING (add it in network-admin.html)');say(ids.includes('vya')?'✅ 3b. site “vya” exists':'❌ 3b. site “vya” is MISSING (add it in network-admin.html)')}
 say('Now press “Test saving (all 3 games)”.')}
async function save(){if(!user){await run();if(!user)return}
 const siteId='tvbd';say('--- Save test on site "'+siteId+'" from '+location.host+' ---');
 for(const g of ['memory','scramble','rush']){const ref=doc(db,'lb_'+g,siteId+'_'+user.uid);let step='read';
  try{const sn=await getDoc(ref);const old=sn.exists()?(sn.data().score||0):0;step=sn.exists()?'update':'create';
   await setDoc(ref,{uid:user.uid,siteId,name:'Test',score:old+1,updatedAt:Date.now()});say('✅ lb_'+g+': '+step+' OK')}
  catch(e){say('❌ lb_'+g+': FAILED at '+step+' → '+(e.code||e.message))}}
 say('Done. Press “Copy result” and send it to me.')}
document.getElementById('run').onclick=run;document.getElementById('save').onclick=save;
document.getElementById('copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(log.join('\n'));};
</script></body></html>
