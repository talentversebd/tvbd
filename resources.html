<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Hub — TalentVerse Bangladesh</title>
<meta name="description" content="বিনামূল্যে নোট, প্রশ্নব্যাংক ও স্টাডি গাইড ডাউনলোড করুন — TalentVerse Bangladesh Resource Hub।">
<link rel="canonical" href="https://talentversebd.github.io/tvbd/resources.html">
<meta property="og:title" content="Resource Hub — TalentVerse Bangladesh">
<meta property="og:description" content="বিনামূল্যে নোট, প্রশ্নব্যাংক ও স্টাডি গাইড।">
<meta property="og:url" content="https://talentversebd.github.io/tvbd/resources.html">
<meta property="og:image" content="https://talentversebd.github.io/tvbd/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .rh-wrap { max-width: 1200px; margin: 0 auto; padding: 110px 20px 60px; }
  .rh-head { text-align: center; margin-bottom: 36px; }
  .rh-head h1 { font-size: 2.4rem; margin-bottom: 10px; color: var(--txt); font-weight: 800; }
  .rh-head p { color: var(--muted); font-size: 1rem; }
  .rh-stats { display: flex; justify-content: center; gap: 28px; margin-top: 18px; flex-wrap: wrap; }
  .rh-stat { text-align: center; }
  .rh-stat .n { font-size: 1.4rem; font-weight: 800; color: var(--blue-br); display: block; }
  .rh-stat .l { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  .rh-search { max-width: 520px; margin: 0 auto 24px; position: relative; }
  .rh-search input {
    width: 100%; padding: 14px 48px 14px 20px;
    border-radius: 30px; border: 1px solid var(--bdr);
    background: var(--card); color: var(--txt);
    font-size: .95rem; outline: none; font-family: inherit;
    transition: border-color .2s, box-shadow .2s;
  }
  .rh-search input:focus { border-color: var(--blue-br); box-shadow: 0 0 0 4px rgba(37,99,235,.12); }
  .rh-search-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

  .rh-filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .rh-filter-btn {
    padding: 8px 18px; border-radius: 25px;
    background: var(--card); border: 1px solid var(--bdr);
    color: var(--txt); font-size: .82rem; cursor: pointer;
    transition: all .2s; font-family: inherit; font-weight: 500;
  }
  .rh-filter-btn:hover { border-color: var(--blue-br); transform: translateY(-2px); }
  .rh-filter-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

  .rh-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px; margin-top: 28px;
  }
  .rh-card {
    background: var(--card); border: 1px solid var(--bdr);
    border-radius: 14px; padding: 20px;
    transition: transform .25s, box-shadow .25s, border-color .25s;
    display: flex; flex-direction: column;
  }
  .rh-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(37,99,235,.18);
    border-color: var(--blue-br);
  }
  .rh-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .rh-icon {
    width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    background: linear-gradient(135deg, rgba(37,99,235,.15), rgba(37,99,235,.05));
  }
  .rh-badge {
    font-size: .62rem; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
    background: rgba(37,99,235,.12); color: var(--blue-br);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .rh-card h3 { font-size: 1rem; color: var(--txt); margin-bottom: 6px; font-weight: 700; line-height: 1.4; }
  .rh-card-desc {
    font-size: .82rem; color: var(--muted);
    line-height: 1.55; margin-bottom: 14px; flex-grow: 1;
  }
  .rh-meta { display: flex; gap: 14px; font-size: .72rem; color: var(--muted); margin-bottom: 14px; flex-wrap: wrap; }
  .rh-meta span { display: flex; align-items: center; gap: 4px; }

  .rh-download-btn {
    display: inline-flex; align-items: center;
    justify-content: center; gap: 8px;
    padding: 11px 16px; border-radius: 10px;
    background: var(--blue); color: white;
    font-size: .85rem; font-weight: 600;
    text-decoration: none; transition: background .2s, transform .2s;
    border: none; cursor: pointer; font-family: inherit;
  }
  .rh-download-btn:hover { background: var(--blue-dk); transform: translateY(-2px); }

  .rh-empty, .rh-loader { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--muted); }
  .rh-empty-icon { font-size: 3rem; margin-bottom: 12px; }
  .rh-spinner {
    width: 40px; height: 40px; margin: 0 auto 12px;
    border: 3px solid var(--bdr); border-top-color: var(--blue);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .rh-wrap { padding: 95px 14px 40px; }
    .rh-head h1 { font-size: 1.8rem; }
    .rh-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header id="site-header">
  <a class="h-logo" href="index.html">
    <img class="h-logo-img" src="logo.jpg" alt="TalentVerse Logo">
    <div class="h-logo-text">
      <div class="name">Talent<span>Verse</span></div>
      <div class="sub">Bangladesh</div>
    </div>
  </a>
  <nav class="h-nav" id="hnav">
    <a href="index.html" data-i18n="nav_home">Home</a>
    <a href="events.html" data-i18n="nav_olympiads">Events &amp; Quiz</a>
    <a href="resources.html" class="active" data-i18n="nav_resources">Resources</a>
    <a href="team.html" data-i18n="nav_team">Team</a>
    <a href="news.html" data-i18n="nav_news">News</a>
    <a href="contact.html" data-i18n="nav_contact">Contact</a>
  </nav>
  <button class="hamburger" id="hbtn" onclick="toggleMobileNav()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</header>

<main class="rh-wrap">

  <div class="rh-head">
    <h1>📚 <span data-i18n="rh_title">Resource Hub</span></h1>
    <p data-i18n="rh_sub">বিনামূল্যে নোট, প্রশ্নব্যাংক ও স্টাডি গাইড</p>
    <div class="rh-stats">
      <div class="rh-stat"><span class="n" id="rh-stat-total">0</span><span class="l" data-i18n="rh_stat_total">Resources</span></div>
      <div class="rh-stat"><span class="n" id="rh-stat-dl">0</span><span class="l" data-i18n="rh_stat_dl">Downloads</span></div>
      <div class="rh-stat"><span class="n">64</span><span class="l" data-i18n="rh_stat_dist">Districts</span></div>
    </div>
  </div>

  <!-- Search -->
  <div class="rh-search">
    <input type="text" id="rh-search" placeholder="নোট খুঁজুন..." oninput="filterResources()">
    <span class="rh-search-icon">🔍</span>
  </div>

  <!-- Category Filters -->
  <div class="rh-filters" id="rh-cat-filters">
    <button class="rh-filter-btn active" data-cat="all" onclick="setCategory('all', this)">সব</button>
    <button class="rh-filter-btn" data-cat="Math" onclick="setCategory('Math', this)">📐 গণিত</button>
    <button class="rh-filter-btn" data-cat="Science" onclick="setCategory('Science', this)">🔬 বিজ্ঞান</button>
    <button class="rh-filter-btn" data-cat="English" onclick="setCategory('English', this)">📖 ইংরেজি</button>
    <button class="rh-filter-btn" data-cat="ICT" onclick="setCategory('ICT', this)">💻 আইসিটি</button>
    <button class="rh-filter-btn" data-cat="Bangla" onclick="setCategory('Bangla', this)">📝 বাংলা</button>
    <button class="rh-filter-btn" data-cat="General" onclick="setCategory('General', this)">🌍 সাধারণ জ্ঞান</button>
  </div>

  <!-- Class Filters -->
  <div class="rh-filters" id="rh-class-filters">
    <button class="rh-filter-btn active" data-cls="all" onclick="setClass('all', this)">সব ক্লাস</button>
    <button class="rh-filter-btn" data-cls="SSC" onclick="setClass('SSC', this)">SSC</button>
    <button class="rh-filter-btn" data-cls="HSC" onclick="setClass('HSC', this)">HSC</button>
    <button class="rh-filter-btn" data-cls="Admission" onclick="setClass('Admission', this)">Admission</button>
    <button class="rh-filter-btn" data-cls="Olympiad" onclick="setClass('Olympiad', this)">অলিম্পিয়াড</button>
  </div>

  <!-- Resource Grid -->
  <div class="rh-grid" id="rh-grid">
    <div class="rh-loader">
      <div class="rh-spinner"></div>
      <p>লোড হচ্ছে...</p>
    </div>
  </div>

</main>

<!-- Firebase SDK -->
<script type="module" src="firebase-config.js"></script>
<script src="data.js"></script>
<script src="lang.js"></script>
<script src="main.js"></script>

<script>
let allResources = [];
let currentCategory = 'all';
let currentClass = 'all';

document.addEventListener('DOMContentLoaded', () => {
  const check = setInterval(async () => {
    if (typeof loadResources === 'function' && window.firebaseDB) {
      clearInterval(check);
      try {
        await loadResources();
        allResources = getResources();
        updateStats();
        renderResources();
      } catch (err) {
        console.error("Resource load error:", err);
        showEmpty("লোড করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
      }
    }
  }, 300);
});

function updateStats() {
  const total = allResources.length;
  const dls = allResources.reduce((s, r) => s + (Number(r.downloads) || 0), 0);
  const el1 = document.getElementById('rh-stat-total');
  const el2 = document.getElementById('rh-stat-dl');
  if (el1) el1.textContent = total;
  if (el2) el2.textContent = dls;
}

function getCategoryIcon(cat) {
  const icons = {
    Math: '📐', Science: '🔬', English: '📖',
    ICT: '💻', General: '🌍', Bangla: '📝'
  };
  return icons[cat] || '📄';
}

function renderResources() {
  const grid = document.getElementById('rh-grid');
  if (!grid) return;
  const search = (document.getElementById('rh-search')?.value || '').toLowerCase();

  let filtered = allResources.filter(r => {
    const matchCat = currentCategory === 'all' || r.category === currentCategory;
    const matchCls = currentClass === 'all' || r.classLevel === currentClass;
    const matchSearch = !search ||
      (r.title || '').toLowerCase().includes(search) ||
      (r.description || '').toLowerCase().includes(search) ||
      (r.subject || '').toLowerCase().includes(search);
    return matchCat && matchCls && matchSearch;
  });

  if (filtered.length === 0) {
    showEmpty("কোনো রিসোর্স পাওয়া যায়নি");
    return;
  }

  grid.innerHTML = '';
  filtered.forEach(r => {
    const card = document.createElement('div');
    card.className = 'rh-card';
    card.innerHTML = `
      <div class="rh-card-top">
        <div class="rh-icon">${getCategoryIcon(r.category)}</div>
        <span class="rh-badge">${r.classLevel || r.category || 'General'}</span>
      </div>
      <h3>${escapeHtml(r.title || 'Untitled')}</h3>
      <p class="rh-card-desc">${escapeHtml(r.description || '')}</p>
      <div class="rh-meta">
        <span>👁️ ${r.views || 0}</span>
        <span>⬇️ ${r.downloads || 0}</span>
        ${r.fileSize ? `<span>📦 ${escapeHtml(r.fileSize)}</span>` : ''}
      </div>
      <a class="rh-download-btn" href="${r.fileUrl || '#'}"
         target="_blank" rel="noopener"
         onclick="trackDownload('${r.id}')">
        ⬇️ ডাউনলোড
      </a>
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function showEmpty(msg) {
  const grid = document.getElementById('rh-grid');
  if (!grid) return;
  grid.innerHTML = `
    <div class="rh-empty">
      <div class="rh-empty-icon">📭</div>
      <p>${escapeHtml(msg)}</p>
    </div>`;
}

function setCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('#rh-cat-filters .rh-filter-btn')
    .forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderResources();
}

function setClass(cls, btn) {
  currentClass = cls;
  document.querySelectorAll('#rh-class-filters .rh-filter-btn')
    .forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderResources();
}

function filterResources() { renderResources(); }

async function trackDownload(id) {
  try {
    if (typeof incrementResourceDownload === 'function') {
      await incrementResourceDownload(id);
      const r = allResources.find(x => x.id === id);
      if (r) { r.downloads = (Number(r.downloads) || 0) + 1; updateStats(); }
    }
  } catch (e) { console.error(e); }
}
</script>

</body>
      </html>
